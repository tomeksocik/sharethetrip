<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share the Trip</title>
<style>
:root { color-scheme: light dark; --ink:#1c1b18; --muted:#6b6a66; --bg:#fcfbf8;
  --card:#fff; --line:#e5e3dd; --accent:#0f5a3e; }
@media (prefers-color-scheme: dark) { :root { --ink:#eceae4; --muted:#a3a19b;
  --bg:#16171a; --card:#1e2023; --line:#2f3237; --accent:#79c9a0; } }
body { margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
main { max-width:34rem; margin:0 auto; padding:4rem 1.25rem; }
h1 { font-size:1.9rem; margin:0 0 .35rem; }
p.lead { color:var(--muted); margin:0 0 2.5rem; }
a.card { display:block; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:1rem 1.15rem; margin-bottom:.75rem;
  text-decoration:none; color:var(--ink); }
a.card span { display:block; color:var(--muted); font-size:.9rem; margin-top:.15rem; }
a.badge { display:inline-block; margin:0 4px 2rem; }
a.badge img { display:block; height:40px; width:auto; }
footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
<h1>Share the Trip</h1>
<p class="lead">Rozliczanie kosztów wspólnej podróży na iPhone.</p>
<!-- App Store: odkomentuj i podmień 0000000000 na App ID po zatwierdzeniu
     aplikacji (punkt checklisty #59 w repozytorium ExpenseSplitter).
     Stoi tu, a nie niżej, bo po publikacji to jest powód, dla którego ktoś tu
     trafia; dokumenty prawne są tłem. Ukryte do tego czasu celowo - strona nie
     ma obiecywać pobrania, którego nie da się wykonać. Ten sam wzorzec co
     `AppStoreLinks.appURL` w aplikacji: dopóki nie ma ID, wejście się nie
     renderuje.

     Oba pliki to ORYGINALNE odznaki Apple (Marketing Resources, wariant
     polski, 119,66×40). Nie wolno ich przerysowywać, przekolorowywać ani
     ściskać - wytyczne Apple dopuszczają wyłącznie skalowanie z zachowaniem
     proporcji, przy wysokości nie mniejszej niż 40 px na ekranie i wolnym
     marginesem co najmniej 1/10 wysokości dookoła (stąd `margin` w .badge).
     Dwa warianty, bo czarna odznaka ginie na ciemnym tle strony.
<a class="badge" href="https://apps.apple.com/pl/app/id0000000000">
  <picture>
    <source srcset="/appstore-pl-white.svg" media="(prefers-color-scheme: dark)">
    <img src="/appstore-pl-black.svg" alt="Pobierz w App Store" width="120" height="40">
  </picture>
</a>
-->
<a class="card" href="/privacy/">Polityka prywatności<span>Privacy Policy</span></a>
<a class="card" href="/terms/">Warunki korzystania<span>Terms of Use</span></a>
<footer>Tomasz Socik · <a href="mailto:support@sharethetrip.pl">support@sharethetrip.pl</a></footer>
</main>
</body>
</html>
